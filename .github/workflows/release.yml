name: Publish Loom Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish an alpha or promote an existing alpha
        required: true
        type: choice
        options: [alpha, promote]
        default: alpha
      source:
        description: Exact main commit SHA for an alpha
        type: string
      alpha:
        description: Existing alpha tag to promote
        type: string
      version:
        description: Stable version for promotion; optional explicit alpha version
        type: string
  schedule:
    - cron: '47 23 * * *'
      timezone: America/Los_Angeles

permissions:
  contents: write
  actions: read

concurrency:
  group: loom-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Publish verified source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_ALPHA: ${{ inputs.alpha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            RELEASE_MODE=daily
            RELEASE_SOURCE="$GITHUB_SHA"
          fi
          go run ./internal/cmd/release --publish --mode "$RELEASE_MODE" \
            --source "$RELEASE_SOURCE" --alpha "$RELEASE_ALPHA" --version "$RELEASE_VERSION"
