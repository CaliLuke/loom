name: Windows Canary

# On-demand compile + unit-test canary for Windows. Windows is not a primary
# target (the audience is mac/linux and no maintainer has a Windows machine),
# so it is not part of the per-PR pipeline and has no schedule; dispatch it
# manually (Actions tab or `gh workflow run windows-canary.yml`) when a
# Windows user reports an issue or before a release that should be checked
# on Windows. Lint and integration tests do not run on Windows (the Makefile
# skips them loudly).

on:
  workflow_dispatch:

jobs:
  windows-unit:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build and unit test
        run: make ci
