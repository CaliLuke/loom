name: Windows Canary

# Weekly compile + unit-test canary for Windows. Windows is not a primary
# target (the audience is mac/linux and no maintainer has a Windows machine),
# so it is not part of the per-PR pipeline; this catches compile breakage and
# unit regressions on a schedule, and can be dispatched manually when a
# Windows user reports an issue. Lint and integration tests do not run on
# Windows (the Makefile skips them loudly).

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  windows-unit:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build and unit test
        run: make ci
