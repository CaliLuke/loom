name: Run Static Checks and Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Windows is not part of the per-PR pipeline: the audience is mac/linux
  # and the Windows job only ran unit tests while being the pipeline's
  # critical path. A weekly compile+unit canary lives in windows-canary.yml.
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
        id: go

      - name: Build
        run: make ci

      - name: Upload test coverage for deep source
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out

  race:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: make depend

      - name: Race and shuffled-order unit tests
        run: make test-race

  openapi-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.11.1'

      - name: OpenAPI contract smoke
        run: make openapi-contract

  value-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Lean toolchain manager
        run: sudo apt-get update && sudo apt-get install --yes elan
      - name: Install pinned Lean and bundled checker
        run: elan toolchain install "$(cat expr/lean/value_projection/lean-toolchain)"
      - name: Make Lean tools available
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Audited proof and executed Go conformance
        run: make value-contract-conformance

  generated-code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: make depend

      - name: Generated code quality
        run: make generated-code-quality

  testdata-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: ['codegen/service', 'http/codegen', 'grpc/codegen', 'jsonrpc/codegen', 'expr']
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: make depend
      - name: Compile exported testdata designs
        run: make test-testdata-compile TESTDATA_RUN='TestDesigns/${{ matrix.domain }}/'

  # Run the same pinned latest-stable Redis image as local validation.
  pulse-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pulse suites against supported Redis
        run: make test-pulse-redis

  release-ready:
    name: Release eligibility
    if: always()
    needs: [ci, race, openapi-contract, value-contract, generated-code-quality, testdata-compile, pulse-redis]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
