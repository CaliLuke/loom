name: Run Static Checks and Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Windows is not part of the per-PR pipeline: the audience is mac/linux
  # and the Windows job only ran unit tests while being the pipeline's
  # critical path. An on-demand compile+unit canary lives in windows-canary.yml.
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
        id: go

      - name: Install dependencies
        run: make depend

      - name: Static checks
        run: make lint

      - name: Transport integration tests
        run: make integration-test

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [http, grpc, generator, jsonrpc, importer, remaining]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install test dependencies
        run: make depend-test
      - name: Tests with race, shuffled order and coverage
        run: make test-ci-lane TEST_LANE=${{ matrix.lane }}
      - name: Upload completed lane
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.lane }}
          path: coverage-parts/coverage-${{ matrix.lane }}
          if-no-files-found: error
          overwrite: true

  coverage:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download completed lanes
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-parts
      - name: Verify complete coverage and enforce ratchet
        run: make test-ci-merge
      - name: Upload test coverage for deep source
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out
          if-no-files-found: error
          overwrite: true

  openapi-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      - name: OpenAPI contract smoke
        run: make openapi-contract

  generated-code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: make depend

      - name: Generated code quality
        run: make generated-code-quality

  testdata-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: ['codegen/service', 'http/codegen', 'grpc/codegen', 'jsonrpc/codegen', 'expr']
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: make depend-test
      - name: Compile exported testdata designs
        run: make test-testdata-compile TESTDATA_RUN='TestDesigns/${{ matrix.domain }}/'

  # Run the same pinned latest-stable Redis image as local validation.
  pulse-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pulse suites against supported Redis
        run: make test-pulse-redis

  release-ready:
    name: Release eligibility
    if: always()
    needs: [ci, tests, coverage, openapi-contract, generated-code-quality, testdata-compile, pulse-redis]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
