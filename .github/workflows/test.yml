name: Run Static Checks and Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Windows is not part of the per-PR pipeline: the audience is mac/linux
  # and the Windows job only ran unit tests while being the pipeline's
  # critical path. A weekly compile+unit canary lives in windows-canary.yml.
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0-rc.3'
        id: go

      - name: Build
        run: make ci

      - name: Upload test coverage for deep source
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out

  race:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0-rc.3'

      - name: Install dependencies
        run: make depend

      - name: Race and shuffled-order unit tests
        run: make test-race

  openapi-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0-rc.3'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: OpenAPI contract smoke
        run: make openapi-contract

  generated-code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0-rc.3'

      - name: Install dependencies
        run: make depend

      - name: Generated code quality
        run: make generated-code-quality
