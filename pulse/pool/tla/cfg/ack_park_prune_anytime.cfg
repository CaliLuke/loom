\* WorkerEventAck: DESIGN = "park", parked acks pruned while their Add runs
SPECIFICATION FairSpec
CONSTANTS
    DESIGN = "park"
    MaxRoutes = 3
    AMBIGUOUS_FAIL = TRUE
    DUP_ACK = TRUE
    SHUTDOWN = TRUE
    PRUNE_ANYTIME = TRUE
INVARIANT TypeOK
INVARIANT NoUnknownAckForRoutedEvent
INVARIANT NoRegistrationWithoutAdd
INVARIANT AckedOnlyAfterWorker
INVARIANT MatchedAtMostOnce
INVARIANT AckedWhenWorkerAcked
INVARIANT NoLeakWhenSettled
INVARIANT ParkedBounded
PROPERTY ParkedDrains
PROPERTY PromptAck
