\* Inv 2, B2 end to end: no dedup; no orphan, rebalance, close, crash or false death (other double-start sources); design asis, Redis 6.2
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Workers = {"w1", "w2"}
    Keys = {"k1"}
    Host <- DefaultHost
    WOrder <- DefaultOrder
    NoW = NoW
    RepMaps = {"wmap", "cl", "jm", "pl"}
    MaxEv = 3
    MaxTok = 2
    MaxStream = 1
    MaxEpoch = 2
    FALSE_DEATH = FALSE
    LEASE_BOUND = FALSE
    LEASE_EXPIRE_HELD = FALSE
    ENABLE_STOP = TRUE
    ENABLE_CLOSE = FALSE
    ENABLE_CRASH = FALSE
    ENABLE_REBALANCE = FALSE
    ENABLE_ORPHAN = FALSE
    ENABLE_WRITES = FALSE
    ALLOW_PARTIAL = TRUE
    REDELIVER_INFLIGHT = FALSE
    ORPHAN_GRACE_COVERS_LAG = FALSE
    PRE_BA2AF97C = FALSE
    TRACK_STREAM = TRUE
    REDIS7 = FALSE
    ENABLE_TTL = TRUE
    GUARD_DESIGN = "asis"
    FIX_LOCK_RELEASE = TRUE
    FIX_DEDUP = FALSE
    FIX_DISPATCH = TRUE
    FIX_EVICT_STOP = TRUE
    FIX_OWNER = FALSE
    FIX_RECHECK = FALSE
    FIX_SELF_FENCE = FALSE
    FIX_EPOCH = FALSE
INVARIANT TypeOK
INVARIANT NoDoubleStartSameWorker
