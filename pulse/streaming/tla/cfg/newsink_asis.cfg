\* Main before the fix of #531: AddStream and RemoveStream as fixed by #481
\* and #508, and NewSink creates the group and the consumer before it adds
\* the consumer to the map. Expect an AddedHasGroup violation: a concurrent
\* RemoveStream sees no consumer in the map and destroys the group between
\* the consumer creation and the map update of NewSink (issue #531).
SPECIFICATION Spec
CONSTANTS
    Instances = {i1, i2}
    CREATE_FIRST = FALSE
    ROLLBACK = TRUE
    REMOVE = "checked"
    NEW_SINK = "create_first"
INVARIANTS
    TypeOK
    NoStaleMember
    AddedHasGroup
