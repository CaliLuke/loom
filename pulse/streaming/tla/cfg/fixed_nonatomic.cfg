\* The fix of #481 as shipped: the map first, rollback on a failed group
\* creation, and RemoveStream before the fix of #508 (separate map update and
\* unconditional group destroy). Expect NoStaleMember to hold. AddedHasGroup
\* is not checked here: the RemoveStream race (#508) violates it, see
\* fixed_remove_asis.cfg. NewSink is not modeled.
