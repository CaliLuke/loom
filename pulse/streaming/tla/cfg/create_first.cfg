\* The alternative fix of #481: the group first, then the map. Expect an
\* AddedHasGroup violation: a concurrent RemoveStream destroys the group
\* between the two steps, even with the checked destroy of #508. NewSink is
\* not modeled; newsink_asis.cfg checks the same order in NewSink.
SPECIFICATION Spec
CONSTANTS
    Instances = {i1, i2}
    CREATE_FIRST = TRUE
    ROLLBACK = FALSE
    REMOVE = "checked"
    NEW_SINK = "none"
INVARIANTS
    TypeOK
    NoStaleMember
    AddedHasGroup
