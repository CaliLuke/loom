\* The fix of #481 with a future atomic RemoveStream (#508): the map first,
\* rollback on a failed group creation, and a RemoveStream that removes the
\* consumer and destroys an unused group in one step. Expect both
\* invariants to hold.
SPECIFICATION Spec
CONSTANTS
    Instances = {i1, i2, i3}
    CREATE_FIRST = FALSE
    ROLLBACK = TRUE
    ATOMIC_REMOVE = TRUE
INVARIANTS
    TypeOK
    NoStaleMember
    AddedHasGroup
