\* The code on main: the fix of #481 (the map first, rollback on a failed
\* group creation) and the fix of #508 (RemoveStream destroys the group in
\* a separate script that first checks that the map holds no consumer).
\* Expect both invariants to hold. This covers AddStream and RemoveStream
\* only: NewSink still uses the create-first order (issue #531).
SPECIFICATION Spec
CONSTANTS
    Instances = {i1, i2, i3}
    CREATE_FIRST = FALSE
    ROLLBACK = TRUE
    REMOVE = "checked"
INVARIANTS
    TypeOK
    NoStaleMember
    AddedHasGroup
