\* The code on main: the fix of #481 (the map first, rollback on a failed
\* group creation), the fix of #508 (RemoveStream destroys the group in a
\* separate script that first checks that the map holds no consumer) and the
\* fix of #531 (NewSink adds the consumer to the map before it creates the
\* group and the consumer, and removes it again when either fails). Expect
\* both invariants to hold.
SPECIFICATION Spec
CONSTANTS
    Instances = {i1, i2, i3}
    CREATE_FIRST = FALSE
    ROLLBACK = TRUE
    REMOVE = "checked"
    NEW_SINK = "map_first"
INVARIANTS
    TypeOK
    NoStaleMember
    AddedHasGroup
