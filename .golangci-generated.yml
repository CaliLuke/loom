version: "2"
run:
  # Wait for other local or release checks while retaining the linter lock.
  allow-serial-runners: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
    - errorlint
    - staticcheck
  exclusions:
    # This gate intentionally analyzes freshly generated source.
    generated: disable
  settings:
    staticcheck:
      checks: ["SA*"]
