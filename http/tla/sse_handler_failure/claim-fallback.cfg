\* Candidate reachability control: after the claim, the first error encoding
\* fails before commitment and the same owner's fallback commits.
\* Must fail FallbackUnreachable (a witness of reachability, not a defect).
SPECIFICATION Spec
CONSTANTS
  Design = "claim"
  Seeds = {"fresh"}
  Ops = {"open", "write"}
INVARIANTS TypeOK NoMixedBody SingleFinalAttempt FallbackUnreachable
