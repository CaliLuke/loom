openapi: 3.2.0
info:
    title: Tick Tock SSE Fixture
    version: 0.0.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
    - name: ticktock
      url: http://localhost:80
      description: Default server for ticktock
paths:
    /guarded:
        get:
            operationId: clock.guarded
            parameters:
                - name: token
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: string
                  example: Veritatis excepturi deleniti laudantium.
            responses:
                "200":
                    $ref: '#/components/responses/TickTockEventTextEventStreamStatus200Response'
                "401":
                    description: 'unauthorized: Unauthorized response.'
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
            summary: Guarded clock
            tags:
                - clock
            x-loom-async:
                direction: server
                handshake:
                    path: /guarded
                    request:
                        method: GET
                    response:
                        contentType: text/event-stream
                        status: 200
                messages:
                    outbound:
                        contentType: application/json
                        schema:
                            type: object
                            properties:
                                data:
                                    type: string
                                    example: Hic ut in.
                                event:
                                    type: string
                                    example: Eaque occaecati vitae ut illo qui sint.
                            example:
                                data: Ut minima et aut corrupti.
                                event: Enim veniam iste.
                            required:
                                - event
                                - data
                        sse:
                            dataField: data
                            eventField: event
                            idField: null
                            requestIDField: null
                            retryField: null
                transport: sse
    /tick:
        get:
            operationId: clock.tick
            responses:
                "200":
                    $ref: '#/components/responses/TickTockEventTextEventStreamStatus200Response'
            summary: Tick clock
            tags:
                - clock
            x-loom-async:
                direction: server
                handshake:
                    path: /tick
                    request:
                        method: GET
                    response:
                        contentType: text/event-stream
                        status: 200
                messages:
                    outbound:
                        contentType: application/json
                        schema:
                            type: object
                            properties:
                                data:
                                    type: string
                                    example: Minus quos qui.
                                event:
                                    type: string
                                    example: Veritatis sint aut iste repellendus.
                            example:
                                data: Quis illum aliquam.
                                event: Provident autem quibusdam.
                            required:
                                - event
                                - data
                        sse:
                            dataField: data
                            eventField: event
                            idField: null
                            requestIDField: null
                            retryField: null
                transport: sse
    /tock:
        get:
            operationId: clock.tock
            responses:
                "200":
                    $ref: '#/components/responses/TickTockEventTextEventStreamStatus200Response'
            summary: Tock clock
            tags:
                - clock
            x-loom-async:
                direction: server
                handshake:
                    path: /tock
                    request:
                        method: GET
                    response:
                        contentType: text/event-stream
                        status: 200
                messages:
                    outbound:
                        contentType: application/json
                        schema:
                            type: object
                            properties:
                                data:
                                    type: string
                                    example: Ea incidunt eveniet.
                                event:
                                    type: string
                                    example: Magnam facere perferendis laboriosam doloribus.
                            example:
                                data: Sint accusamus et.
                                event: Sit eos et perferendis maiores dolor.
                            required:
                                - event
                                - data
                        sse:
                            dataField: data
                            eventField: event
                            idField: null
                            requestIDField: null
                            retryField: null
                transport: sse
components:
    schemas:
        Problem:
            type: object
            properties:
                code:
                    type: string
                    description: Code is the stable machine-readable problem code.
                    example: bad_request
                detail:
                    type: string
                    description: Detail is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                instance:
                    type: string
                    description: Instance identifies this specific occurrence of the problem.
                    example: urn:loom:error:123abc
                retry_hint:
                    type: string
                    description: Retry hint is concise guidance on how to correct the request or retry the operation.
                    example: Correct the payload and retry.
                status:
                    type: integer
                    description: Status is the HTTP status code generated for this occurrence of the problem.
                    example: 400
                    format: int64
                title:
                    type: string
                    description: Title is a short, human-readable summary of the problem type.
                    example: Bad Request
                type:
                    type: string
                    description: Type identifies the problem category using a URI reference.
                    example: https://github.com/CaliLuke/loom/problems/bad-request
            description: Problem response result type
            example:
                code: bad_request
                detail: parameter 'p' must be an integer
                instance: urn:loom:error:123abc
                retry_hint: Correct the payload and retry.
                status: 400
                title: Bad Request
                type: https://github.com/CaliLuke/loom/problems/bad-request
            required:
                - type
                - title
                - status
                - detail
                - instance
                - code
        TickTockEvent:
            type: object
            properties:
                data:
                    type: string
                    example: Deserunt laudantium consectetur.
                event:
                    type: string
                    example: Dignissimos rerum quod illum.
            example:
                data: Quidem laborum recusandae officia eaque nulla rerum.
                event: Nisi provident accusamus rerum neque et quo.
            required:
                - event
                - data
    responses:
        TickTockEventTextEventStreamStatus200Response:
            description: OK response.
            content:
                text/event-stream:
                    itemSchema:
                        type: object
                        properties:
                            data:
                                type: string
                                contentMediaType: application/json
                                contentSchema:
                                    $ref: '#/components/schemas/TickTockEvent'
                        required:
                            - data
                        additionalProperties: false
tags:
    - name: clock
