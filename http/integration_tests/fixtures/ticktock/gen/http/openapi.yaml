openapi: 3.1.1
info:
    title: Tick Tock SSE Fixture
    version: 0.0.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
    - url: http://localhost:80
      description: Default server for ticktock
paths:
    /guarded:
        get:
            operationId: clock.guarded
            parameters:
                - allowEmptyValue: true
                  example: Similique et.
                  in: query
                  name: token
                  schema:
                    example: Provident et in.
                    type: string
            responses:
                "200":
                    $ref: '#/components/responses/TickTockEventTextEventStreamStatus200Response'
                "401":
                    content:
                        application/vnd.loom.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 'unauthorized: Unauthorized response.'
            summary: Guarded clock
            tags:
                - clock
            x-loom-async:
                direction: server
                handshake:
                    path: /guarded
                    request:
                        method: GET
                    response:
                        contentType: text/event-stream
                        status: 200
                messages:
                    outbound:
                        contentType: application/json
                        schema:
                            type: object
                            properties:
                                data:
                                    type: string
                                    example: Deserunt voluptas nisi.
                                event:
                                    type: string
                                    example: Exercitationem praesentium.
                            example:
                                data: Eos cumque fugiat ut suscipit.
                                event: Quia nam eum sit similique excepturi.
                            required:
                                - event
                                - data
                        sse:
                            dataField: data
                            eventField: event
                            idField: null
                            requestIDField: null
                            retryField: null
                transport: sse
    /tick:
        get:
            operationId: clock.tick
            responses:
                "200":
                    $ref: '#/components/responses/TickTockEventTextEventStreamStatus200Response'
            summary: Tick clock
            tags:
                - clock
            x-loom-async:
                direction: server
                handshake:
                    path: /tick
                    request:
                        method: GET
                    response:
                        contentType: text/event-stream
                        status: 200
                messages:
                    outbound:
                        contentType: application/json
                        schema:
                            type: object
                            properties:
                                data:
                                    type: string
                                    example: Fuga nihil et modi.
                                event:
                                    type: string
                                    example: Dolorem illum libero vel aut eos natus.
                            example:
                                data: Corporis expedita dolores ipsam ut sit.
                                event: Id doloremque.
                            required:
                                - event
                                - data
                        sse:
                            dataField: data
                            eventField: event
                            idField: null
                            requestIDField: null
                            retryField: null
                transport: sse
    /tock:
        get:
            operationId: clock.tock
            responses:
                "200":
                    $ref: '#/components/responses/TickTockEventTextEventStreamStatus200Response'
            summary: Tock clock
            tags:
                - clock
            x-loom-async:
                direction: server
                handshake:
                    path: /tock
                    request:
                        method: GET
                    response:
                        contentType: text/event-stream
                        status: 200
                messages:
                    outbound:
                        contentType: application/json
                        schema:
                            type: object
                            properties:
                                data:
                                    type: string
                                    example: Maiores harum corrupti aliquid quis fuga vero.
                                event:
                                    type: string
                                    example: Aut voluptatem ratione et accusamus saepe.
                            example:
                                data: Eveniet autem praesentium dolorem rem nobis aliquid.
                                event: Pariatur ut beatae doloribus quae commodi.
                            required:
                                - event
                                - data
                        sse:
                            dataField: data
                            eventField: event
                            idField: null
                            requestIDField: null
                            retryField: null
                transport: sse
components:
    schemas:
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: true
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: false
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: false
            example:
                fault: false
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: true
                timeout: false
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
        TickTockEvent:
            type: object
            properties:
                data:
                    type: string
                    example: Eum voluptatum quisquam non ea debitis.
                event:
                    type: string
                    example: Porro voluptatum omnis et.
            example:
                data: Et sunt velit sed expedita et.
                event: Architecto amet.
            required:
                - event
                - data
    responses:
        TickTockEventTextEventStreamStatus200Response:
            description: OK response.
            content:
                text/event-stream:
                    schema:
                        $ref: '#/components/schemas/TickTockEvent'
tags:
    - name: clock
