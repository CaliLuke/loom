openapi: 3.1.1
info:
    title: Tick Tock SSE Fixture
    version: 0.0.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
    - url: http://localhost:80
      description: Default server for ticktock
paths:
    /guarded:
        get:
            operationId: clock.guarded
            parameters:
                - allowEmptyValue: true
                  example: Quia nam eum sit similique excepturi.
                  in: query
                  name: token
                  schema:
                    example: Deserunt voluptas nisi.
                    type: string
            responses:
                "200":
                    $ref: '#/components/responses/TickTockEventTextEventStreamStatus200Response'
                "401":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: 'unauthorized: Unauthorized response.'
            summary: Guarded clock
            tags:
                - clock
            x-loom-async:
                direction: server
                handshake:
                    path: /guarded
                    request:
                        method: GET
                    response:
                        contentType: text/event-stream
                        status: 200
                messages:
                    outbound:
                        contentType: application/json
                        schema:
                            type: object
                            properties:
                                data:
                                    type: string
                                    example: Ut beatae doloribus quae commodi magni.
                                event:
                                    type: string
                                    example: Corrupti aliquid quis fuga vero consequatur.
                            example:
                                data: Nobis aliquid est exercitationem praesentium.
                                event: Autem praesentium dolorem.
                            required:
                                - event
                                - data
                        sse:
                            dataField: data
                            eventField: event
                            idField: null
                            requestIDField: null
                            retryField: null
                transport: sse
    /tick:
        get:
            operationId: clock.tick
            responses:
                "200":
                    $ref: '#/components/responses/TickTockEventTextEventStreamStatus200Response'
            summary: Tick clock
            tags:
                - clock
            x-loom-async:
                direction: server
                handshake:
                    path: /tick
                    request:
                        method: GET
                    response:
                        contentType: text/event-stream
                        status: 200
                messages:
                    outbound:
                        contentType: application/json
                        schema:
                            type: object
                            properties:
                                data:
                                    type: string
                                    example: Numquam quidem magni quia earum magni.
                                event:
                                    type: string
                                    example: Et sunt velit sed expedita et.
                            example:
                                data: Nihil et modi quo id doloremque non.
                                event: Illum libero vel aut eos natus deleniti.
                            required:
                                - event
                                - data
                        sse:
                            dataField: data
                            eventField: event
                            idField: null
                            requestIDField: null
                            retryField: null
                transport: sse
    /tock:
        get:
            operationId: clock.tock
            responses:
                "200":
                    $ref: '#/components/responses/TickTockEventTextEventStreamStatus200Response'
            summary: Tock clock
            tags:
                - clock
            x-loom-async:
                direction: server
                handshake:
                    path: /tock
                    request:
                        method: GET
                    response:
                        contentType: text/event-stream
                        status: 200
                messages:
                    outbound:
                        contentType: application/json
                        schema:
                            type: object
                            properties:
                                data:
                                    type: string
                                    example: Ut sit nemo aut voluptatem.
                                event:
                                    type: string
                                    example: Expedita dolores.
                            example:
                                data: Tempore maiores.
                                event: Et accusamus.
                            required:
                                - event
                                - data
                        sse:
                            dataField: data
                            eventField: event
                            idField: null
                            requestIDField: null
                            retryField: null
                transport: sse
components:
    schemas:
        Problem:
            type: object
            properties:
                code:
                    type: string
                    description: Code is the stable machine-readable problem code.
                    example: bad_request
                detail:
                    type: string
                    description: Detail is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                instance:
                    type: string
                    description: Instance identifies this specific occurrence of the problem.
                    example: urn:loom:error:123abc
                retry_hint:
                    type: string
                    description: Retry hint is concise guidance on how to correct the request or retry the operation.
                    example: Correct the payload and retry.
                status:
                    type: integer
                    description: Status is the HTTP status code generated for this occurrence of the problem.
                    example: 400
                    format: int64
                title:
                    type: string
                    description: Title is a short, human-readable summary of the problem type.
                    example: Bad Request
                type:
                    type: string
                    description: Type identifies the problem category using a URI reference.
                    example: https://github.com/CaliLuke/loom/problems/bad-request
            example:
                code: bad_request
                detail: parameter 'p' must be an integer
                instance: urn:loom:error:123abc
                retry_hint: Correct the payload and retry.
                status: 400
                title: Bad Request
                type: https://github.com/CaliLuke/loom/problems/bad-request
            required:
                - type
                - title
                - status
                - detail
                - instance
                - code
        TickTockEvent:
            type: object
            properties:
                data:
                    type: string
                    example: Porro voluptatum omnis et.
                event:
                    type: string
                    example: Sint voluptas ut ab officia.
            example:
                data: Architecto amet.
                event: Eum voluptatum quisquam non ea debitis.
            required:
                - event
                - data
    responses:
        TickTockEventTextEventStreamStatus200Response:
            description: OK response.
            content:
                text/event-stream:
                    schema:
                        $ref: '#/components/schemas/TickTockEvent'
tags:
    - name: clock
