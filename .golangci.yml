version: "2"
run:
  # Wait for other local or release checks while retaining the linter lock.
  allow-serial-runners: true
linters:
  enable:
    - staticcheck   # Current stable bundle supports the pinned Go release
    - errorlint     # Better error handling patterns for Go 1.13+
    - errcheck      # Check for unchecked errors
    - dupl          # Detect duplicated code blocks
    - gocyclo       # Enforce a cyclomatic complexity ceiling
    - maintidx      # Enforce maintainability index floor (Halstead + cyclomatic + LOC)
    - unparam       # Detects unused parameters
    - unused        # Detects unused constants, variables, functions and types
    - ineffassign   # Detects ineffectual assignments
    - bodyclose     # Check HTTP response body is closed
    - gocritic      # Provides bug, performance and style diagnostics
    - misspell      # Check for misspelled words
    - nakedret      # Check naked returns in large functions
    - prealloc      # Suggest preallocating slices
    - unconvert     # Remove unnecessary type conversions
    - whitespace    # Check for unnecessary whitespace
    - nilerr        # Find code that returns nil even if error is not nil
    - copyloopvar   # Check for loop variable issues  
    - sqlclosecheck # Check sql.Rows and sql.Stmt are closed
    - makezero      # Find slice declarations with non-zero initial length
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - maintidx
      # The integration-test harness and scenario framework are test support
      # code in non-_test.go files. Their long step-driven functions follow
      # the same exemption as _test.go files.
      - path: integration_tests/(framework|harness)/
        linters:
          - maintidx
  settings:
    staticcheck:
      checks: ["SA*"]
    dupl:
      threshold: 150
    gocyclo:
      min-complexity: 50
    maintidx:
      under: 35
    nakedret:
      max-func-lines: 30
    misspell:
      ignore-rules:
        - Statuser
