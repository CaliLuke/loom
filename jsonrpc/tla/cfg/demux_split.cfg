\* WebSocketClientDemux: DESIGN = "demux_split", the first Release: drop the
\* last reference, unlock, then mark and close the connection.
SPECIFICATION Spec
CONSTANTS
    DESIGN = "demux_split"
    Streams = {"s1", "s2"}
    MaxSends = 2
    TIMEOUT = FALSE
    CANCEL = FALSE
    CLOSE = TRUE
    SOCKET_FAIL = FALSE
    CLIENT_CLOSE = FALSE
    NOTIFY = FALSE
INVARIANT TypeOK
INVARIANT NoCloseUnderAcquire
