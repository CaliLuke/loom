\* WebSocketClientDemux: DESIGN = "asis", all faults, two streams. Checks the
\* gorilla/websocket one-reader and one-writer rules.
SPECIFICATION FairSpec
CONSTANTS
    DESIGN = "asis"
    Streams = {"s1", "s2"}
    MaxSends = 2
    TIMEOUT = TRUE
    CANCEL = TRUE
    CLOSE = TRUE
    SOCKET_FAIL = TRUE
    CLIENT_CLOSE = TRUE
    NOTIFY = TRUE
INVARIANT TypeOK
INVARIANT OneReader
INVARIANT OneWriter
