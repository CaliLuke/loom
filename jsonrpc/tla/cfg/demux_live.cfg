\* WebSocketClientDemux: DESIGN = "demux", liveness. Timeouts and canceled
\* Recv calls are left out: a timeout would end every wait by itself, and
\* they do not change how a response or a failure reaches a waiter.
SPECIFICATION FairSpec
CONSTANTS
    DESIGN = "demux"
    Streams = {"s1", "s2"}
    MaxSends = 2
    TIMEOUT = FALSE
    CANCEL = FALSE
    CLOSE = TRUE
    SOCKET_FAIL = TRUE
    CLIENT_CLOSE = TRUE
    NOTIFY = TRUE
INVARIANT TypeOK
INVARIANT NoStuckRecv
INVARIANT NoCloseUnderAcquire
PROPERTY RecvReturns
