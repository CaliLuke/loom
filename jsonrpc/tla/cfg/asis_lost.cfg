\* WebSocketClientDemux: DESIGN = "asis" without the one-reader check, no
\* faults. Checks whether a response can be dropped while its stream waits.
SPECIFICATION FairSpec
CONSTANTS
    DESIGN = "asis"
    Streams = {"s1", "s2"}
    MaxSends = 2
    TIMEOUT = FALSE
    CANCEL = FALSE
    CLOSE = FALSE
    SOCKET_FAIL = FALSE
    CLIENT_CLOSE = FALSE
    NOTIFY = FALSE
INVARIANT TypeOK
INVARIANT NoLostResponse
INVARIANT NoStuckRecv
