\* WebSocketClientDemux: DESIGN = "demux", all faults, two streams, safety.
SPECIFICATION Spec
CONSTANTS
    DESIGN = "demux"
    Streams = {"s1", "s2"}
    MaxSends = 2
    TIMEOUT = TRUE
    CANCEL = TRUE
    CLOSE = TRUE
    SOCKET_FAIL = TRUE
    CLIENT_CLOSE = TRUE
    NOTIFY = TRUE
INVARIANT TypeOK
INVARIANT OneReader
INVARIANT OneWriter
INVARIANT OwnResponses
INVARIANT NoLostResponse
INVARIANT UniqueIds
INVARIANT NoStuckRecv
INVARIANT NoLeakAfterStop
INVARIANT ClosedWhenReleased
INVARIANT NoCloseUnderAcquire
