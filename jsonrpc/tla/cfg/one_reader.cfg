\* WebSocketClientDemux: DESIGN = "one_reader", no faults, two streams
SPECIFICATION FairSpec
CONSTANTS
    DESIGN = "one_reader"
    Streams = {"s1", "s2"}
    MaxSends = 2
    TIMEOUT = FALSE
    CANCEL = FALSE
    CLOSE = FALSE
    SOCKET_FAIL = FALSE
    CLIENT_CLOSE = FALSE
    NOTIFY = FALSE
INVARIANT TypeOK
INVARIANT OneReader
INVARIANT OneWriter
INVARIANT OwnResponses
INVARIANT NoLostResponse
INVARIANT UniqueIds
INVARIANT NoStuckRecv
