openapi: 3.2.0
info:
  title: Import symmetry
  version: "1"
tags:
  - name: root
  - name: catalog
    summary: Catalog
    description: Catalog operations.
    parent: root
    kind: navigation
    externalDocs:
      url: https://example.com/catalog
      description: Catalog guide.
    x-color: blue
security:
  - Basic: []
  - Bearer: []
  - OAuth: [read]
paths:
  /items:
    get:
      operationId: listItems
      tags: [catalog]
      parameters:
        - name: q
          in: query
          style: form
          allowReserved: true
          schema:
            type: string
        - name: session
          in: cookie
          style: cookie
          schema:
            type: string
      responses:
        "200":
          summary: Item list
          description: Items.
          headers:
            X-Cursor:
              description: Cursor.
              allowReserved: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
              examples:
                shared:
                  $ref: "#/components/examples/Item"
                inline:
                  summary: Inline item
                  dataValue:
                    id: item-2
                  serializedValue: '{"id":"item-2"}'
components:
  examples:
    Item:
      summary: Shared item
      description: A reusable item.
      value:
        id: item-1
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: User credentials.
    Bearer:
      type: http
      scheme: bearer
      deprecated: true
    OAuth:
      type: oauth2
      oauth2MetadataUrl: https://auth.example.com/.well-known/oauth-authorization-server
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          refreshUrl: https://auth.example.com/refresh
          scopes:
            read: Read access.
        clientCredentials:
          tokenUrl: https://auth.example.com/token
          scopes:
            read: Read access.
