openapi: 3.1.1
info:
  title: Pet API
  description: A small import fixture.
  version: 1.2.3
x-migration-review:
  status: reviewed
paths:
  /pets/{pet_id}:
    parameters:
      - $ref: "#/components/parameters/PetID"
      - name: limit
        in: query
        description: Inherited page limit.
        schema:
          type: integer
          format: int32
    get:
      operationId: pets.get
      summary: Get a pet
      description: Returns one pet.
      tags: [pets]
      x-operation-note: gated
      parameters:
        - name: limit
          in: query
          description: Operation page limit.
          schema:
            type: integer
            format: int32
        - name: X-Request-ID
          in: header
          x-param-note: identifier
          schema:
            type: string
            format: uuid
            x-param-schema-note: trace-id
      responses:
        "200":
          description: Found pet.
          headers:
            X-Trace-ID:
              description: Request trace identifier.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /pets:
    post:
      operationId: pets.create
      tags: [pets]
      requestBody:
        required: true
        description: Pet to create.
        x-request-note: body-gated
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created pet.
          x-response-note:
            state: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
  /legacy:
    get:
      operationId: legacy.get
      tags: [pets]
      responses:
        "302":
          description: Moved permanently.
        "400":
          description: Invalid redirect request.
components:
  schemas:
    NewPet:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum: [cat, dog]
          default: cat
        active:
          type: boolean
          const: true
      required: [name]
      additionalProperties: false
    Pet:
      type: object
      x-schema-note:
        audience: public
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        nickname:
          type: string
          deprecated: true
        secret:
          type: string
          writeOnly: true
        weight:
          type: number
        stock:
          type: integer
        status:
          allOf:
            - $ref: "#/components/schemas/Status"
        labels:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
      required: [id, name, status]
    Problem:
      type: object
      properties:
        detail:
          type: string
      required: [detail]
    Status:
      type: integer
      enum: [1, 2]
  parameters:
    PetID:
      name: pet_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
